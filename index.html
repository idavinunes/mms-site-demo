  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ficado RA1000 — Reclame Aqui, excelente índice de atendimento\" style=\"height: 110px; width: auto; display: block; flex: none;\">\n          <div style=\"max-width: 460px;\">\n            <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: #102C54; margin-bottom: 6px;\">Selo RA1000 — Reclame Aqui<\u002Fdiv>\n            <p style=\"font-size: 16px; color: #5a6473; line-height: 1.6; margin: 0;\">Conquistamos o RA1000, concedido a empresas com excelente índice de atendimento: alta taxa de resposta, boa avaliação e voltariam a fazer negócio.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ========================= SIMULADOR ========================= -->\n  <sc-if value=\"{{ isSimulador }}\" hint-placeholder-val=\"{{ false }}\">\n  <main data-screen-label=\"Simulador\">\n    <section style=\"background: linear-gradient(160deg,#0C2447,#16386B); padding: 56px 28px;\">\n      <div style=\"max-width: 1000px; margin: 0 auto; text-align: center;\">\n        <h1 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 46px; font-weight: 800; color: #fff; margin: 0 0 12px; letter-spacing: -0.01em;\">Simulador de empréstimo<\u002Fh1>\n        <p style=\"font-size: 18px; color: #c2d0e4; margin: 0; line-height: 1.6;\">Faça uma estimativa rápida. Sem cadastro, sem compromisso.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background: #F6F8FB; padding: 56px 28px 80px;\">\n      <div style=\"max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 24px 60px -28px rgba(16,44,84,.35); overflow: hidden; display: grid; grid-template-columns: 1.15fr 0.85fr;\">\n        <!-- inputs -->\n        <div style=\"padding: 40px;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #102C54; margin-bottom: 10px;\">O que você procura?<\u002F -weight: 600; font-size: 15px; margin-bottom: 6px;\">Sua nova parcela estimada<\u002Fdiv>\n            <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 46px; font-weight: 800; color: #fff; line-height: 1;\">{{ parcelaFmt }}<\u002Fdiv>\n            <div style=\"display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: rgba(31,168,85,.18); border: 1px solid rgba(31,168,85,.4); color: #6ee7a0; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 15px; align-self: flex-start;\">▼ Economia de {{ economiaFmt }}/mês<\u002Fdiv>\n            <div style=\"height: 1px; background: rgba(255,255,255,.12); margin: 26px 0;\"><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; margin-bottom: 12px;\"><span style=\"color:#c2d0e4; font-size:15px;\">Você paga hoje<\u002Fspan><span style=\"color:#fff; font-weight:700;\">{{ curParcelaFmt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color:#c2d0e4; font-size:15px;\">Passaria a pagar<\u002Fspan><span style=\"color:#6ee7a0; font-weight:800;\">{{ parcelaFmt }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <a href=\"{{ waLinkSim }}\" target=\"_blank\" style=\"text-decoration: none; display: block; text-align: center; background: linear-gradient(90deg,#2F7DF0,#1F50C0); color: #fff; padding: 16px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px; margin-top: 30px;\">Falar com consultor<\u002Fa>\n          <div style=\"font-size: 11px; color: #7e93b3; text-align: center; margin-top: 12px; line-height: 1.5;\">Estimativa para fins informativos. As condições finais dependem de análise de crédito e da margem disponível no seu benefício.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ========================= CONTATO ========================= -->\n  <sc-if v ; font-size: 18px; word-break: break-all;\">{{ email }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fa>\n          <div style=\"display: flex; align-items: center; gap: 16px; background: #F6F8FB; border: 1px solid #eef1f5; border-radius: 18px; padding: 24px;\">\n            <div style=\"width: 50px; height: 50px; border-radius: 14px; background: #eaf2fb; display: flex; align-items: center; justify-content: center; font-size: 24px;\">🕘<\u002Fdiv>\n            <div><div style=\"color: #8a94a6; font-size: 13px; font-weight: 600;\">Horário de atendimento<\u002Fdiv><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; color: #102C54; font-weight: 800; font-size: 18px;\">Seg. a Sex., 9h às 18h<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FORM -->\n        <div style=\"background: #F6F8FB; border: 1px solid #eef1f5; border-radius: 22px; padding: 36px;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #102C54; margin-bottom: 6px;\">Solicite seu atendimento<\u002Fdiv>\n          <p style=\"font-size: 15px; color: #5a6473; margin: 0 0 24px;\">Preencha e nós retornamos pelo WhatsApp em até 24h.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\n            <div>\n              <label style=\"display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: #102C54; margin-bottom: 7px;\">Nome completo<\u002Flabel>\n              <input type=\"text\" value=\"{{ fName }}\" onchange=\"{{ onFName }}\" placeholder=\"Seu nome\" style=\"width: 100%; padding: 14px; border-radius: 11px; border: 1.5px solid #e3e9f1; font-family: 'Mulish', sans-serif; font-size: 16px; background: #fff; color: #102C54;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: #102C54; margin-bottom: 7px;\">Telefone / WhatsApp<\u002Flabel>\n              <input type=\"tel\" value=\"{{ fPhone }}\" onchange=\"{{ onFPhone }}\" placeholder=\"(00) 00000-0000\" style=\"width: 100%; padding: 14px; border-radius: 11px; border: 1.5px solid #e3e9f1; font-family: 'Mulish', sans-serif; font-size: 16px; background: #fff; color: #102C54;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 16px;\">\n            <label style=\"display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: #102C54; margin-bottom: 7px;\">Você é...<\u002Flabel>\n            <select value=\"{{ fTipo }}\" onchange=\"{{ onFTipo }}\" style=\"width: 100%; padding: 14px; border-radius: 11px; border: 1.5px solid #e3e9f1; font-family: 'Mulish', sans-serif; font-size: 16px; background: #fff; color: #102C54;\">\n              <option value=\"Aposentado(a) INSS\">Aposentado(a) INSS<\u002Foption>\n              <option value=\"Pensionista INSS\">Pensionista INSS<\u002Foption>\n              <option value=\"Servidor Federal\">Servidor Federal<\u002Foption>\n              <option value=\"Outro\">Outro<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 24px;\">\n            <label style=\"display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: #102C54; margin-bottom: 7px;\">Como podemos ajudar?<\u002Flabel>\n            <textarea value=\"{{ fMsg }}\" onchange=\"{{ onFMsg }}\" placeholder=\"Conte rapidamente o que você precisa\" style=\"width: 100%; min-height: 96px; padding: 14px; border-radius: 11px; border: 1.5px solid #e3e9f1; font-family: 'Mulish', sans-serif; font-size: 16px; background: #fff; color: #102C54; resize: vertical;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <a href=\"{{ waLinkForm }}\" target=\"_blank\" style=\"text-decoration: none; display: block; text-align: center; background: #1FA855; color: #fff; padding: 17px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px; box-shadow: 0 12px 26px -12px rgba(31,168,85,.7);\">Enviar pelo WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ========================= FAQ ========================= -->\n  <sc-if value=\"{{ isFaq }}\" hint-placeholder-val=\"{{ false }}\">\n  <main data-screen-label=\"Dúvidas\">\n    <section style=\"background: linear-gradient(160deg,#0C2447,#16386B); padding: 64px 28px;\">\n      <div style=\"max-width: 820px; margin: 0 auto; text-align: center;\">\n        <h1 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 48px; font-weight: 800; color: #fff; margin: 0 0 14px; letter-spacing: -0.01em;\">Dúvidas frequentes<\u002Fh1>\n        <p style=\"font-size: 19px; color: #c2d0e4; margin: 0; line-height: 1.6;\">Tudo o que você precisa saber, em linguagem simples.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background: #F6F8FB; padding: 64px 28px 80px;\">\n      <div style=\"max-width: 820px; margin: 0 auto;\">\n        <sc-for list=\"{{ faqItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ item.toggle }}\" style=\"background: #fff; border: 1px solid #eef1f5; border-radius: 14px; padding: 22px 24px; margin-bottom: 12px; cursor: pointer;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; color: #102C54;\">{{ item.q }}<\u002Fspan>\n              <span style=\"flex: none; font-size: 22px; color: #1F50C0; font-weight: 700;\">{{ item.sign }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size: 16px; color: #5a6473; line-height: 1.65; margin: 14px 0 0;\">{{ item.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"text-align: center; margin-top: 40px;\">\n          <p style=\"font-size: 17px; color: #5a6473; margin: 0 0 18px;\">Não encontrou sua dúvida?<\u002Fp>\n          <a href=\"{{ waLink }}\" target=\"_blank\" style=\"text-decoration: none; display: inline-flex; align-items: center; gap: 10px; background: #1FA855; color: #fff; padding: 16px 30px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px;\">Perguntar no WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ========================= FOOTER ========================= -->\n  <footer style=\"background: #081a36; padding: 56px 28px 28px;\">\n    <div style=\"max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 36px; padding-bottom: 36px; border-bottom: 1px solid rgba(255,255,255,.1);\">\n        <div>\n          <img src=\"b25ebf7c-5244-4bd0-a92b-d2e875f58dc5\" alt=\"MMS\" style=\"height: 40px; width: auto; display: block; margin-bottom: 18px;\">\n          <p style=\"font-size: 15px; color: #8fa3c0; line-height: 1.65; margin: 0; max-width: 280px;\">Assessoria financeira especializada em crédito consignado para aposentados, pensionistas do INSS e servidores federais.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Navegação<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <span onclick=\"{{ goHome }}\" style=\"cursor: pointer; color: #a9bad3;\">Início<\u002Fspan>\n            <span onclick=\"{{ goServicos }}\" style=\"cursor: pointer; color: #a9bad3;\">Serviços<\u002Fspan>\n            <span onclick=\"{{ goSobre }}\" style=\"cursor: pointer; color: #a9bad3;\">Sobre<\u002Fspan>\n            <span onclick=\"{{ goSimulador }}\" style=\"cursor: pointer; color: #a9bad3;\">Simulador<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Atendimento<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <span onclick=\"{{ goFaq }}\" style=\"cursor: pointer; color: #a9bad3;\">Dúvidas frequentes<\u002Fspan>\n            <span onclick=\"{{ goContato }}\" style=\"cursor: pointer; color: #a9bad3;\">Fale conosco<\u002Fspan>\n            <span style=\"color: #a9bad3;\">Seg. a Sex., 9h às 18h<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Contato<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <a href=\"{{ tel0800Link }}\" style=\"text-decoration: none; color: #a9bad3;\">{{ tel0800 }}<\u002Fa>\n            <a href=\"{{ waLink }}\" target=\"_blank\" style=\"text-decoration: none; color: #a9bad3;\">{{ phone }}<\u002Fa>\n            <a href=\"{{ mailLink }}\" style=\"text-decoration: none; color: #a9bad3; word-break: break-all;\">{{ email }}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 24px;\">\n        <span style=\"font-size: 13px; color: #6b7d99;\">© 2026 MMS Assessoria Financeira. Todos os direitos reservados.<\u002Fspan>\n        <span style=\"font-size: 13px; color: #6b7d99; max-width: 560px; text-align: right;\">A MMS atua como correspondente/assessoria e não realiza empréstimos diretamente. Valores simulados são estimativos.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;tel0800&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0800 042 0229&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;(00) 00000-0000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5500000000000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;contato@mmsconsignados.com.br&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home',\n    simMode: 'novo',      // novo | reduzir\n    simBenefit: 'INSS',   // INSS | Federal\n    simValor: 5000,\n    simPrazo: 60,\n    simSaldo: 18000,\n    simCurParcela: 600,\n    openFaq: 0,\n    fName: '', fPhone: '', fTipo: 'Aposentado(a) INSS', fMsg: ''\n  };\n\n  go(page) {\n    this.setState({ page });\n    if (typeof window !== 'undefined') {\n      window.scrollTo(0, 0);\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        const mn = document.querySelector('main');\n        if (mn && mn.animate) mn.animate(\n          [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],\n          { duration: 420, easing: 'ease' }\n        );\n      }));\n    }\n  }\n\n  rate() { return this.state.simBenefit === 'INSS' ? 0.0166 : 0.0150; }\n\n  pmt(pv, n) {\n    const i = this.rate();\n    return pv * i / (1 - Math.pow(1 + i, -n));\n  }\n\n  brl(n, cents) {\n    if (n == null || isNaN(n)) n = 0;\n    return 'R$ ' + Number(n).toLocaleString('pt-BR', {\n      minimumFractionDigits: cents ? 2 : 0,\n      maximumFractionDigits: cents ? 2 : 0\n    });\n  }\n\n  componentDidMount() {\n    if (typeof window === 'undefined') return;\n    this._io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; e.target.removeAttribute('data-fx-hidden'); this._io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    this._io2 = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { this._countUp(e.target); this._io2.unobserve(e.target); } });\n    }, { threshold: 0.5 });\n    this._onScroll = () => {\n      const hd = document.querySelector('header'); if (!hd) return;\n      const inner = hd.firstElementChild; const img = hd.querySelector('img');\n      const s = window.scrollY > 24;\n      if (inner) { inner.style.transition = 'padding .25s ease'; inner.style.paddingTop = s ? '4px' : '8px'; inner.style.paddingBottom = s ? '4px' : '8px'; }\n      if (img) { img.style.transition = 'height .25s ease'; img.style.height = s ? '28px' : '34px'; }\n      hd.style.boxShadow = s ? '0 6px 24px -8px rgba(0,0,0,.6)' : '0 4px 20px -8px rgba(0,0,0,.5)';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._fxTimer = setTimeout(() => {\n      document.querySelectorAll('[data-fx-hidden]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; el.removeAttribute('data-fx-hidden'); });\n    }, 1700);\n    this._setupFx();\n  }\n\n  componentDidUpdate() { this._setupFx(); }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._io2) this._io2.disconnect();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._fxTimer) clearTimeout(this._fxTimer);\n  }\n\n  _countUp(el) {\n    const target = parseFloat(el.dataset.count); if (isNaN(target)) return;\n    const prefix = el.dataset.prefix || ''; const suffix = el.dataset.suffix || '';\n    const dur = 1100; const start = performance.now();\n    const tick = (now) => {\n      const p = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      el.textContent = prefix + Math.round(target * e) + suffix;\n      if (p < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  _setupFx() {\n    if (typeof window === 'undefined' || !this._io) return;\n    // subtle button hover\n    document.querySelectorAll('a[target=\"_blank\"], [data-fx-btn]').forEach(el => {\n      if (el.__fxBound) return; el.__fxBound = true;\n      el.addEventListener('mouseenter', () => { el.style.transition = 'transform .18s ease, filter .18s ease'; el.style.transform = 'translateY(-2px)'; el.style.filter = 'brightness(1.06)'; });\n      el.addEventListener('mouseleave', () => { el.style.transform = ''; el.style.filter = ''; });\n    });\n    // scroll reveal for sections\n    document.querySelectorAll('section').forEach(el => {\n      if (el.dataset.fxR) return; el.dataset.fxR = '1';\n      el.style.transition = 'opacity .7s ease, transform .7s ease';\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.9) {\n        el.style.opacity = '0'; el.style.transform = 'translateY(14px)';\n        requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'none'; }));\n      } else {\n        el.style.opacity = '0'; el.style.transform = 'translateY(28px)'; el.setAttribute('data-fx-hidden', '1'); this._io.observe(el);\n      }\n    });\n    // count-up\n    document.querySelectorAll('[data-count]').forEach(el => { if (el.dataset.fxC) return; el.dataset.fxC = '1'; this._io2.observe(el); });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const phone = this.props.phone ?? '(00) 00000-0000';\n    const tel0800 = this.props.tel0800 ?? '0800 042 0229';\n    const email = this.props.email ?? 'contato@mmsconsignados.com.br';\n    const waDigits = (this.props.whatsapp ?? '5500000000000').replace(/\\D/g, '');\n    const wa = (msg) => 'https://wa.me/' + waDigits + (msg ? '?text=' + encodeURIComponent(msg) : '');\n\n    const n = +s.simPrazo;\n    const isNovo = s.simMode === 'novo';\n    const parcela = isNovo ? this.pmt(+s.simValor, n) : this.pmt(+s.simSaldo, n);\n    const total = parcela * n;\n    const economia = Math.max(0, (+s.simCurParcela) - parcela);\n\n    const sel = (active) => ({\n      bg: active ? '#102C54' : '#eef2f7',\n      color: active ? '#fff' : '#7a8699'\n    });\n    const inss = sel(s.simBenefit === 'INSS');\n    const fed = sel(s.simBenefit === 'Federal');\n    const mNovo = sel(s.simMode === 'novo');\n    const mRed = sel(s.simMode === 'reduzir');\n\n    const faqRaw = [\n      ['Quem pode contratar o empréstimo consignado?', 'Aposentados e pensionistas do INSS e servidores públicos federais com margem disponível no benefício ou contracheque. A gente verifica sua margem gratuitamente.'],\n      ['O desconto vem direto do meu benefício?', 'Sim. No consignado, a parcela é descontada automaticamente do seu benefício ou salário, o que garante as menores taxas e mais segurança para você.'],\n      ['Como funciona a redução de parcelas?', 'Analisamos seus contratos atuais e negociamos diretamente com o banco, geralmente por meio de refinanciamento, para diminuir o valor que você paga todo mês.'],\n      ['Preciso pagar alguma coisa pela consultoria?', 'Não. A análise e a orientação da MMS são gratuitas. Você só assume o contrato se as condições forem boas para você.'],\n      ['Em quanto tempo recebo um retorno?', 'Nosso compromisso é responder em até 24 horas. Muitas vezes o retorno acontece no mesmo dia do contato.'],\n      ['A MMS é confiável?', 'Sim. Respondemos 100% das manifestações no Reclame Aqui e mantemos uma central de SAC dedicada a resolver qualquer questão do início ao fim.']\n    ];\n    const faqItems = faqRaw.map((f, i) => ({\n      q: f[0], a: f[1],\n      open: s.openFaq === i,\n      sign: s.openFaq === i ? '−' : '+',\n      toggle: () => this.setState({ openFaq: s.openFaq === i ? -1 : i })\n    }));\n\n    const simMsg = isNovo\n      ? `Olá! Simulei um empréstimo de ${this.brl(s.simValor)} em ${n}x (${s.simBenefit}), parcela estimada de ${this.brl(parcela, true)}. Gostaria de saber mais.`\n      : `Olá! Quero reduzir minha parcela. Hoje pago ${this.brl(s.simCurParcela, true)} sobre um saldo de ${this.brl(s.simSaldo)} (${s.simBenefit}). Pode me ajudar?`;\n    const formMsg = `Olá! Meu nome é ${s.fName || '[nome]'}. Sou ${s.fTipo}. Telefone: ${s.fPhone || '[telefone]'}. ${s.fMsg ? 'Mensagem: ' + s.fMsg : ''}`;\n\n    return {\n      isHome: s.page === 'home',\n      isServicos: s.page === 'servicos',\n      isSobre: s.page === 'sobre',\n      isSimulador: s.page === 'simulador',\n      isContato: s.page === 'contato',\n      isFaq: s.page === 'faq',\n\n      goHome: () => this.go('home'),\n      goServicos: () => this.go('servicos'),\n      goSobre: () => this.go('sobre'),\n      goSimulador: () => this.go('simulador'),\n      goContato: () => this.go('contato'),\n      goFaq: () => this.go('faq'),\n\n      phone, email, tel0800,\n      tel0800Link: 'tel:+55' + tel0800.replace(/\\D/g, ''),\n      waLink: wa('Olá! Gostaria de uma consultoria sobre crédito consignado.'),\n      waLinkSim: wa(simMsg),\n      waLinkForm: wa(formMsg),\n      mailLink: 'mailto:' + email,\n\n      isNovo, isReduzir: !isNovo,\n      simValor: s.simValor, simPrazo: String(s.simPrazo), simSaldo: s.simSaldo, simCurParcela: s.simCurParcela,\n      valorFmt: this.brl(s.simValor),\n      saldoFmt: this.brl(s.simSaldo),\n      curParcelaFmt: this.brl(s.simCurParcela, true),\n      parcelaFmt: this.brl(parcela, true),\n      totalFmt: this.brl(total, true),\n      economiaFmt: this.brl(economia, true),\n\n      inssBg: inss.bg, inssColor: inss.color,\n      federalBg: fed.bg, federalColor: fed.color,\n      modeNovoBg: mNovo.bg, modeNovoColor: mNovo.color,\n      modeReduzirBg: mRed.bg, modeReduzirColor: mRed.color,\n\n      setBenefitINSS: () => this.setState({ simBenefit: 'INSS' }),\n      setBenefitFederal: () => this.setState({ simBenefit: 'Federal' }),\n      setModeNovo: () => this.setState({ simMode: 'novo' }),\n      setModeReduzir: () => this.setState({ simMode: 'reduzir' }),\n      onValor: (e) => this.setState({ simValor: +e.target.value }),\n      onPrazo: (e) => this.setState({ simPrazo: +e.target.value }),\n      onSaldo: (e) => this.setState({ simSaldo: +e.target.value }),\n      onCurParcela: (e) => this.setState({ simCurParcela: +e.target.value }),\n\n      faqItems,\n\n      fName: s.fName, fPhone: s.fPhone, fTipo: s.fTipo, fMsg: s.fMsg,\n      onFName: (e) => this.setState({ fName: e.target.value }),\n      onFPhone: (e) => this.setState({ fPhone: e.target.value }),\n      onFTipo: (e) => this.setState({ fTipo: e.target.value }),\n      onFMsg: (e) => this.setState({ fMsg: e.target.value })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
